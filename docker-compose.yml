version: "3.9"
services:
  node:
    image: node:16.14.0
    command: yarn run dev
    working_dir: /srv
    volumes:
      - ./:/srv
    ports:
      - "3000:3000"
  db:
    image: postgres:14.1
    environment:
      - POSTGRES_DB=development_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      - "8432:5432"
volumes:
  postgres-data:
    external: false
